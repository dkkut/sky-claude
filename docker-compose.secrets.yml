# Секреты API из ФАЙЛОВ, а не из окружения контейнера (см. server/envfile.mjs).
# Положите значения в каталог secrets/ (права 700, файлы 400, одна строка без лишнего текста) и уберите эти переменные из .env:
#   secrets/jwt_secret  secrets/refresh_token_secret  secrets/encryption_key  secrets/ai_api_key  secrets/s3_access_key  secrets/s3_secret_key
# Запуск:  docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# После этого `docker inspect` и /proc/<pid>/environ значений не покажут. Проверка: bash scripts/env-check.sh
# Если файла для какого-то секрета нет — удалите его строки здесь (пустой секрет сервер не принимает и не стартует).
services:
  api:
    environment:
      JWT_SECRET: ""
      REFRESH_TOKEN_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/refresh_token_secret
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      AI_API_KEY_FILE: /run/secrets/ai_api_key
      STORAGE_S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      STORAGE_S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets: [jwt_secret, refresh_token_secret, encryption_key, ai_api_key, s3_access_key, s3_secret_key]
secrets:
  jwt_secret:           { file: ./secrets/jwt_secret }
  refresh_token_secret: { file: ./secrets/refresh_token_secret }
  encryption_key:       { file: ./secrets/encryption_key }
  ai_api_key:           { file: ./secrets/ai_api_key }
  s3_access_key:        { file: ./secrets/s3_access_key }
  s3_secret_key:        { file: ./secrets/s3_secret_key }
