server {
  listen 80;
  server_name _;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml;
}
