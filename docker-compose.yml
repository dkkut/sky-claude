# ============================================================
#  Sky — продакшн-стек.
#
#  Наружу смотрит только nginx (80/443). API, БД и Redis живут
#  во внутренней сети и с хоста недоступны.
#
#  Лимиты рассчитаны на сервер 12 ГБ RAM: сервисы суммарно берут
#  около 4 ГБ, остальное остаётся ОС, сборке образов и запасу.
#
#  Секреты читаются из .env рядом с этим файлом. Файл не в git —
#  создаётся скриптом scripts/bootstrap-server.sh.
# ============================================================
name: sky

services:
  # -- Edge: TLS, статика, проксирование ---------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-sky-web:local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?нужно задать DOMAIN в .env}
      # Второй вхост — KutRent Market (market.kutrent.online), см.
      # nginx/market-template/market.conf.template. Не задан — используется
      # заведомо недостижимый домен-заглушка: сайт партнёра просто никогда
      # никому не отвечает, остальной Sky это не затрагивает никак.
      MARKET_DOMAIN: ${MARKET_DOMAIN:-market.invalid.local}
      # Третий вхост — лендинг на корневом домене (skymessenger.online), см. nginx/site-template/site.conf.template.
      # Не задан — заглушка-домен, лендинг никому не отвечает, остальной Sky не затрагивается.
      SITE_DOMAIN: ${SITE_DOMAIN:-site.invalid.local}
      # Четвёртый вхост — сайт восстановления доступа (recovery.skymessenger.online), см. nginx/recovery-template.
      RECOVERY_DOMAIN: ${RECOVERY_DOMAIN:-recovery.invalid.local}
      # Резервный адрес API для приложений: тот же вхост, что и DOMAIN, сертификат — SAN основного (scripts/add-reserve-domain.sh).
      RESERVE_DOMAIN: ${RESERVE_DOMAIN:-reserve.invalid.local}
      MIN_APP_BUILD: ${MIN_APP_BUILD:-0}
      GUARD_SECRET: ${GUARD_SECRET:-}
      SANDBOX_SECRET: ${SANDBOX_SECRET:-}
      OPS_SECRET: ${OPS_SECRET:-}
      SANDBOX_MAX_AGE_H: ${SANDBOX_MAX_AGE_H:-24}
      BUILD_ID: ${BUILD_ID:-}
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # command намеренно не переопределяем: entrypoint образа nginx
    # выполняет свои init-скрипты (развёртывание шаблонов, периодический
    # reload) только когда команда контейнера — сам nginx.
    networks: [edge, internal]
    deploy:
      resources:
        limits: { memory: 256M }
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # -- API (8080) и WebSocket-хаб (8081) ---------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ${API_IMAGE:-sky-api:local}
    restart: unless-stopped
    # Штатный init Docker: reaper процессов и корректная передача сигналов.
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV:              production
      API_PORT:              "8080"
      SIGNAL_PORT:           "8081"
      JWT_SECRET:            ${JWT_SECRET:-}
      REFRESH_TOKEN_SECRET:  ${REFRESH_TOKEN_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ACCESS_TTL_SEC:        ${ACCESS_TTL_SEC:-900}
      REFRESH_TTL_SEC:       ${REFRESH_TTL_SEC:-2592000}
      AUTH_START_RATE_MULT:  ${AUTH_START_RATE_MULT:-1}
      REFRESH_ROTATION:      ${REFRESH_ROTATION:-on}
      REFRESH_REUSE_GRACE_SEC: ${REFRESH_REUSE_GRACE_SEC:-86400}
      STAFF_NOTIFY_PER_MIN: ${STAFF_NOTIFY_PER_MIN:-}
      KBIZ_SUB_PRICE_RUB: ${KBIZ_SUB_PRICE_RUB:-89}
      KBIZ_PUBLIC_ORIGIN: ${KBIZ_PUBLIC_ORIGIN:-}
      KBIZ_RATE_MULT: ${KBIZ_RATE_MULT:-1}
      # APP_DATABASE_URL — роль sky_app без прав суперпользователя (scripts/db-harden.sh). Не задана — как раньше, владелец БД.
      DATABASE_URL:          ${APP_DATABASE_URL:-postgres://sky:${POSTGRES_PASSWORD:?нужно задать POSTGRES_PASSWORD в .env}@postgres:5432/sky}
      SKIP_MIGRATE_ON_START: ${SKIP_MIGRATE_ON_START:-0}
      # Демо-аккаунты заводятся только на пустой базе и только если пароль задан.
      # В продакшне переменную оставляют пустой — тогда их не будет вовсе.
      # 'demo' открывает пополнение кошелька без реального платежа.
      # В продакшне не задавайте — иначе баланс рисуется одним запросом.
      PAYMENTS_MODE:         ${PAYMENTS_MODE:-disabled}
      # Отдельный ключ шифрования секретов двухэтапной защиты.
      ENCRYPTION_KEY:        ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_PREV:   ${ENCRYPTION_KEY_PREV:-}
      # Ник владельца сервиса: права администратора у него всегда, и
      # снять их не может никто. Пусто — владельца нет, и назначать
      # администраторов некому.
      OWNER_USERNAME:        ${OWNER_USERNAME:-}
      # Sky Resource Optimizer: порог «медленного запроса» к БД, мс, и каталог, по которому меряется свободное место (по умолчанию корень контейнера).
      DB_SLOW_MS:            ${DB_SLOW_MS:-300}
      DISK_PROBE_DIR:        ${DISK_PROBE_DIR:-/}
      # Sky Recovery: адрес сайта восстановления (в письмах и переходах), сроки ожидания, задержка новой резервной почты.
      RECOVERY_ORIGIN:             ${RECOVERY_ORIGIN:-}
      RECOVERY_WAIT_HOURS:         ${RECOVERY_WAIT_HOURS:-}
      RECOVERY_BACKUP_HOLD_HOURS:  ${RECOVERY_BACKUP_HOLD_HOURS:-}
      # Подтверждение входа по SSH владельцем (scripts/ssh-gate.sh). Пусто — выключено.
      SSH_GATE_SECRET:       ${SSH_GATE_SECRET:-}
      # Где лежат загруженные треки и обложки. Отдельный том, а не образ
      # и не база: файл весит мегабайты, в Postgres он раздул бы каждую
      # резервную копию, а при выдаче прошёл бы через память целиком.
      MUSIC_DIR:             /data/music
      TRANSFER_DIR:          /data/transfer
      LAUNCHER_DIR:          /data/launcher
      LAUNCHER_MAX_FILE_BYTES:  ${LAUNCHER_MAX_FILE_BYTES:-}
      LAUNCHER_MAX_BUILD_BYTES: ${LAUNCHER_MAX_BUILD_BYTES:-}
      LAUNCHER_AV_CMD:       ${LAUNCHER_AV_CMD:-}
      LAUNCHER_AV_ARGS:      ${LAUNCHER_AV_ARGS:-}
      TRANSFER_MAX_MB:       ${TRANSFER_MAX_MB:-}
      # Сайт (лендинг): файлы приложений для скачивания и вложения апелляций/заявок — в томе, не в образе.
      SITE_DIR:              /data/site
      # Кино лежит там же по смыслу, но в своём томе: фильм весит
      # гигабайты, и мерить, чистить и переносить его нужно отдельно от
      # музыки. Потолок на один фильм — FILM_MAX_BYTES; сколько
      # поместится, знает тот, кто видит диск сервера.
      FILM_DIR:              /data/film
      FILM_MAX_BYTES:        ${FILM_MAX_BYTES:-4294967296}
      # Куда Sky TV вообще имеет право ходить за эфиром. Пусто — никуда:
      # ни один источник подключить нельзя, пока его узел не назван здесь
      # явно. Это и есть то место, где владелец подтверждает, что показ с
      # этого узла обеспечен законно.
      # Подкасты — свой том по той же причине, что и кино: видеовыпуск
      # весит столько же. Потолки на файл: звук и видео порознь, потому
      # что это разные по весу вещи.
      PODCAST_DIR:                 /data/podcasts
      PODCAST_AUDIO_MAX_BYTES:     ${PODCAST_AUDIO_MAX_BYTES:-536870912}
      PODCAST_VIDEO_MAX_BYTES:     ${PODCAST_VIDEO_MAX_BYTES:-4294967296}
      # Картинки маркета: фотографии товаров, логотипы, витрины
      # магазинов, обложки игр, фотографии складов. Свой том нужен по
      # той же причине, что афишам: без него пересборка образа стирает
      # фотографии всех выложенных товаров.
      MARKET_DIR:                  /data/market
      # Видеообзоры помещений, которые владельцы общих складов снимают
      # на проверку администрации. Десятки и сотни мегабайт на запись.
      VIDEO_DIR:                   /data/video
      # Остальные хранилища. Раньше для них не было ни переменных, ни
      # томов: файлы писались в слой контейнера и стирались при каждом
      # деплое, а записи в базе оставались — человек видел «видео не
      # загружено» на всём, что загрузил до последней пересборки.
      SKYVIDEO_DIR:                /data/skyvideo
      BOOKS_DIR:                   /data/books
      BLOOM_DIR:                   /data/bloom
      STORY_DIR:                   /data/stories
      GIFTS_DIR:                   /data/gifts
      ADS_DIR:                     /data/ads
      CAMPAIGNS_DIR:               /data/campaigns
      SKIN_DIR:                    /data/skins
      EVIDENCE_DIR:                /data/evidence
      # Google Карты. Ключ серверный: им подписаны запросы, которые
      # делает сам сервер, — разбор адреса и картинка карты. В браузер
      # он не уходит ни разу. Пусто — приложение честно пишет «карта не
      # настроена» вместо того, чтобы рисовать выдуманные точки.
      GOOGLE_MAPS_KEY:             ${GOOGLE_MAPS_KEY:-}
      # Яндекс Карты (Static API и HTTP Геокодер) — второй поставщик, тоже только на сервере.
      YANDEX_MAPS_KEY:             ${YANDEX_MAPS_KEY:-}
      # Push-уведомления при закрытом приложении (server/webpush.mjs). Раньше эти ключи в .env попадали
      # на хост, но не в контейнер — push молча оставался выключенным. Настройка: scripts/setup-push.sh.
      VAPID_PUBLIC_KEY:            ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:           ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:               ${VAPID_SUBJECT:-mailto:admin@localhost}
      SKYKASSA_PARTNERS_JSON:      ${SKYKASSA_PARTNERS_JSON:-}
      # Sky Storage (server/skystorage*.mjs): ключи шифрования копий (отдельно от ENCRYPTION_KEY и JWT_SECRET) и площадка копий.
      # Вносятся скриптом scripts/setup-storage.sh; без них резервное копирование выключено, всё остальное работает.
      STORAGE_KEK_ACTIVE:          ${STORAGE_KEK_ACTIVE:-}
      STORAGE_KEK_K1:              ${STORAGE_KEK_K1:-}
      STORAGE_KEK_K2:              ${STORAGE_KEK_K2:-}
      STORAGE_KEK_K3:              ${STORAGE_KEK_K3:-}
      STORAGE_KEK_K4:              ${STORAGE_KEK_K4:-}
      STORAGE_BACKUP_TARGET:       ${STORAGE_BACKUP_TARGET:-}
      STORAGE_BACKUP_DIR:          ${STORAGE_BACKUP_DIR:-}
      STORAGE_BACKUP_INDEPENDENT:  ${STORAGE_BACKUP_INDEPENDENT:-}
      STORAGE_S3_ENDPOINT:         ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION:           ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET:           ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY:       ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY:       ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PREFIX:           ${STORAGE_S3_PREFIX:-}
      STORAGE_PRIMARY:             ${STORAGE_PRIMARY:-}
      STORAGE_PRIMARY_CACHE_DAYS:  ${STORAGE_PRIMARY_CACHE_DAYS:-}
      STORAGE_JOBS_MODE:           ${STORAGE_JOBS_MODE:-}
      STORAGE_PRIMARY_CACHE_MAX_GB: ${STORAGE_PRIMARY_CACHE_MAX_GB:-}
      STORAGE_S3_PATH_STYLE:       ${STORAGE_S3_PATH_STYLE:-}
      STORAGE_S3_PART_MB:          ${STORAGE_S3_PART_MB:-}
      # Отдельное хранилище резервных копий (другой бакет/хостер). Если задано — копии идут туда, а не в STORAGE_S3_*.
      STORAGE_BACKUP_S3_ENDPOINT:   ${STORAGE_BACKUP_S3_ENDPOINT:-}
      STORAGE_BACKUP_S3_REGION:     ${STORAGE_BACKUP_S3_REGION:-}
      STORAGE_BACKUP_S3_BUCKET:     ${STORAGE_BACKUP_S3_BUCKET:-}
      STORAGE_BACKUP_S3_ACCESS_KEY: ${STORAGE_BACKUP_S3_ACCESS_KEY:-}
      STORAGE_BACKUP_S3_SECRET_KEY: ${STORAGE_BACKUP_S3_SECRET_KEY:-}
      STORAGE_BACKUP_S3_PREFIX:     ${STORAGE_BACKUP_S3_PREFIX:-}
      STORAGE_BACKUP_S3_PATH_STYLE: ${STORAGE_BACKUP_S3_PATH_STYLE:-}
      STORAGE_QUARANTINE_DIR:      /data/storage-quarantine
      STORAGE_STAGING_DIR:         /data/storage-staging
      FCM_SERVICE_ACCOUNT_JSON:    ${FCM_SERVICE_ACCOUNT_JSON:-}
      YANDEX_GEOCODER_KEY:         ${YANDEX_GEOCODER_KEY:-}
      CDEK_API_BASE:               ${CDEK_API_BASE:-}
      CDEK_CLIENT_ID:              ${CDEK_CLIENT_ID:-}
      CDEK_CLIENT_SECRET:          ${CDEK_CLIENT_SECRET:-}
      RUSSIANPOST_API_LOGIN:       ${RUSSIANPOST_API_LOGIN:-}
      RUSSIANPOST_API_PASSWORD:    ${RUSSIANPOST_API_PASSWORD:-}
      TRACK17_API_KEY:             ${TRACK17_API_KEY:-}
      # Одноразовый ключ, которым владелец занимает свой ник при первой
      # регистрации. Занять его обычной регистрацией нельзя: из ника
      # выводятся права владельца всей экосистемы. После первого входа
      # строку можно убрать — второй раз ник не занять ничем.
      OWNER_CLAIM_TOKEN:           ${OWNER_CLAIM_TOKEN:-}
      # Языковая модель: и пересказ выпусков, и Sky AI. Ключ живёт
      # только здесь, в окружении сервера: в браузер уходит готовый
      # ответ, но не ключ. Пусто — Sky AI честно отвечает, что не
      # настроен, вместо того чтобы делать вид, что думает.
      AI_API_KEY:            ${AI_API_KEY:-}
      AI_MODEL:              ${AI_MODEL:-claude-sonnet-4-5-20250929}
      AI_BASE_URL:           ${AI_BASE_URL:-https://api.anthropic.com}
      # Формат запросов к поставщику: chat — /v1/chat/completions (OpenAI-совместимые), иначе /v1/responses.
      # Раньше эта переменная в контейнер не попадала, и Sky AI всегда ходил в /v1/responses.
      AI_API_STYLE:          ${AI_API_STYLE:-}
      # Потолок на новые пересказы за час — на весь сервер, а не на
      # человека: платит за них владелец.
      AI_SUMMARIES_PER_HOUR: ${AI_SUMMARIES_PER_HOUR:-200}
      TV_ALLOWED_HOSTS:      ${TV_ALLOWED_HOSTS:-}
      # Авиабилеты Sky GO (Travelpayouts) и хранилище: до этого эти переменные из .env в контейнер не попадали.
      TRAVELPAYOUTS_TOKEN:   ${TRAVELPAYOUTS_TOKEN:-}
      STORAGE_QUARANTINE_AUTOPURGE: ${STORAGE_QUARANTINE_AUTOPURGE:-}
      # Доставка кодов. 'log' пишет код в журнал и никуда не шлёт —
      # в бою нужен настоящий провайдер, иначе войти никто не сможет.
      SMS_MODE:              ${SMS_MODE:-log}
      SMS_API_ID:            ${SMS_API_ID:-}
      SMS_FROM:              ${SMS_FROM:-}
      SMS_DEVICE_ID:         ${SMS_DEVICE_ID:-}
      SMS_WEBHOOK_URL:       ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN:     ${SMS_WEBHOOK_TOKEN:-}
      EMAIL_MODE:            ${EMAIL_MODE:-log}
      EMAIL_FROM:            ${EMAIL_FROM:-}
      EMAIL_WEBHOOK_URL:     ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_TOKEN:   ${EMAIL_WEBHOOK_TOKEN:-}
      SMTP_HOST:             ${SMTP_HOST:-}
      SMTP_PORT:             ${SMTP_PORT:-465}
      SMTP_USER:             ${SMTP_USER:-}
      SMTP_PASS:             ${SMTP_PASS:-}
      SMTP_SECURE:           ${SMTP_SECURE:-true}
      RESEND_API_KEY:        ${RESEND_API_KEY:-}
      # Разрешает писать коды в журнал в бою. Без крайней нужды не включать.
      ALLOW_LOG_CODES:       ${ALLOW_LOG_CODES:-}
      # Ключи закрытой беты. Пустая строка — калитки нет.
      BETA_KEYS:             ${BETA_KEYS:-}
      TURN_URLS:             ${TURN_URLS:-}
      TURN_SECRET:           ${TURN_SECRET:-}
      TURN_USER:             ${TURN_USER:-}
      TURN_PASS:             ${TURN_PASS:-}
      RTC_STUN_URLS:         ${RTC_STUN_URLS:-}
      RTC_TTL_SEC:           ${RTC_TTL_SEC:-}
      # Откуда разрешено открывать WebSocket: рукопожатие сокета не
      # подчиняется правилам обмена между сайтами, и без этой проверки
      # чужая страница открывает соединения из браузера посетителя.
      DOMAIN:                ${DOMAIN:?нужно задать DOMAIN в .env}
      # Ключи доступа (WebAuthn): по умолчанию rpId — хост DOMAIN, origin — https://DOMAIN (server/passkeys.mjs).
      PASSKEY_RP_ID:         ${PASSKEY_RP_ID:-}
      ADMIN_TOKEN:           ${ADMIN_TOKEN:-}
      ADMIN_TOKEN_UNLOCK_MIN: ${ADMIN_TOKEN_UNLOCK_MIN:-}
      APPLOCK_GRACE_SEC:     ${APPLOCK_GRACE_SEC:-}
      PASSKEY_ORIGINS:       ${PASSKEY_ORIGINS:-}
      EXTRA_ORIGINS:         ${EXTRA_ORIGINS:-}
      # Единственный адрес, куда разрешён редирект с одноразовым
      # токеном входа KutRent Market (server/kutrentmarket.mjs) — тот
      # же домен, что и у nginx-вхоста сайта-партнёра (см. web выше).
      MARKET_DOMAIN:         ${MARKET_DOMAIN:-market.invalid.local}
      REDIS_URL:             redis://:${REDIS_PASSWORD:?нужно задать REDIS_PASSWORD в .env}@redis:6379
      # Расшифровка речи — отдельный поставщик: языковая модель этого
      # не умеет. Пусто — расшифровки нет, и сервер так и говорит.
      STT_API_KEY:           ${STT_API_KEY:-}
      STT_MODEL:             ${STT_MODEL:-whisper-1}
      STT_BASE_URL:          ${STT_BASE_URL:-}
      # Голосовой ответ (текст → речь) — для голосового режима Sky AI.
      # Тоже отдельный поставщик; пусто — ответ только текстом.
      TTS_API_KEY:           ${TTS_API_KEY:-}
      TTS_MODEL:             ${TTS_MODEL:-tts-1}
      TTS_BASE_URL:          ${TTS_BASE_URL:-}
      TTS_VOICE:             ${TTS_VOICE:-alloy}
      # Дневные пределы Sky AI. Бесплатный чат ограничен числом
      # сообщений, а не подпиской.
      AI_CHAT_PER_DAY:       ${AI_CHAT_PER_DAY:-20}
      AI_CHAT_PER_DAY_PRIME: ${AI_CHAT_PER_DAY_PRIME:-50}
      AI_VOICE_PER_DAY:      ${AI_VOICE_PER_DAY:-200}

      # Сколько человек пускать в одну сессию «Вместе». Предел живёт
      # здесь, а не в коде страницы: поднять его должно быть можно, не
      # пересобирая приложение, а обойти из браузера — нельзя.
      TOGETHER_MAX_PARTICIPANTS: ${TOGETHER_MAX_PARTICIPANTS:-10}
    volumes:
      # Музыка переживает пересборку образа: файлы лежат в томе.
      - music-data:/data/music
      # Sky Transfer: временные куски передач между устройствами (удаляются после получения/срока).
      - transfer-data:/data/transfer
      - launcher-data:/data/launcher
      - film-data:/data/film
      - site-data:/data/site
      - podcast-data:/data/podcasts
      # Афиши мероприятий: тоже том, иначе пересборка образа стирает
      # постеры всех опубликованных мероприятий.
      - tickets-data:/data/tickets
      # Файлы, отданные Sky AI на разбор. Живут минуты, но том нужен:
      # без него они пишутся в слой образа, а он только для чтения в
      # части сборок и переполняется в остальных.
      - ai-data:/data/aifiles
      # Картинки маркета и видеообзоры складов: тоже тома, иначе
      # пересборка образа стирает фотографии товаров и записи, по
      # которым склады открывали.
      - market-data:/data/market
      - video-data:/data/video
      - skyvideo-data:/data/skyvideo
      - books-data:/data/books
      - bloom-data:/data/bloom
      - stories-data:/data/stories
      - gifts-data:/data/gifts
      - ads-data:/data/ads
      - campaigns-data:/data/campaigns
      - skins-data:/data/skins
      - evidence-data:/data/evidence
      # Sky Storage: карантин осиротевших файлов и промежуточная область восстановления (не должны пропадать при пересборке).
      - storage-quarantine-data:/data/storage-quarantine
      - storage-staging-data:/data/storage-staging
      # Единственный том-бинд в этом файле, не именованный том: сигнал
      # «выключить сервер при вероятном взломе администратора»
      # (server/breach.mjs) должен дойти до сторожа на самом хосте, вне
      # Docker, — а у именованного тома путь на диске непрямой
      # (/var/lib/docker/volumes/.../_data). Папка пустая, пока сигнала
      # нет; создаёт её сам API при необходимости.
      - ./control:/control
    # internal — чтобы говорить с базой и кэшем, outbound — чтобы
    # достучаться до провайдера SMS и почтового сервера. Без второй
    # сети контейнер не разрешает даже имена: коды отправлять некуда.
    networks: [internal, outbound]
    deploy:
      resources:
        limits: { memory: 1G }
    security_opt: [no-new-privileges:true]
    logging: *logging

  # -- Postgres ----------------------------------------------
  #  Все данные приложения — профили, кошельки, подарки и всё
  #  остальное — уже здесь; DATABASE_URL сервиса api ниже указывает
  #  именно сюда. Данные переживают пересборку и перезапуск образов,
  #  пока жив том postgres-data.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     sky
      POSTGRES_DB:       sky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Инициализация с проверкой контрольных сумм страниц.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky -d sky"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 2G }
    security_opt: [no-new-privileges:true]
    logging: *logging

  # -- Redis: сессии и кэш ------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    deploy:
      resources:
        limits: { memory: 768M }
    security_opt: [no-new-privileges:true]
    logging: *logging

  # -- Certbot: выпуск и продление сертификата ----------------
  #  Просыпается раз в 12 часов, продлевает при необходимости.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Портов не публикует: первичный выпуск запускается отдельной командой
    # с явным -p 80:80 (см. scripts/init-letsencrypt.sh), а продление
    # идёт через webroot уже работающего nginx.
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    networks: [edge]
    logging: *logging

networks:
  # Внешняя сеть: только edge-слой.
  edge:
  # Внутренняя: без выхода в интернет. Здесь живут база и кэш — снаружи
  # до них не дотянуться, и сами они никуда не ходят.
  internal:
    internal: true
  # Выход наружу для API: письма с кодами и SMS отправляют внешние
  # службы, а до них надо дойти. База и кэш в эту сеть не входят —
  # им наружу незачем.
  outbound:

volumes:
  postgres-data:
  redis-data:
  music-data:
  launcher-data:
  transfer-data:
  film-data:
  site-data:
  podcast-data:
  tickets-data:
  ai-data:
  market-data:
  video-data:
  skyvideo-data:
  books-data:
  bloom-data:
  stories-data:
  gifts-data:
  ads-data:
  campaigns-data:
  skins-data:
  evidence-data:
  storage-quarantine-data:
  storage-staging-data:
  certbot-certs:
  certbot-webroot:
