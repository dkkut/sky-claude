name: Сборка Windows (.exe)

# Собрано и на windows-latest намеренно, а не через electron-builder
# + wine на Linux: в песочнице разработки NSIS-упаковка через wine
# ловит несовместимость его экспериментального WoW64-режима с этим
# хостом (ntdll.dll не грузится) — итоговый .exe получается неполным.
# Настоящий Windows-раннер снимает проблему целиком.
on:
  push:
    branches: [claude/project-server-setup-opwwui]
    paths:
      - 'electron/**'
      - 'build-resources/**'
      - 'package.json'
      - '.env.native'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Сборка .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Проверка типов
        run: npx tsc --noEmit

      # Интерфейс вшивается прямо в установщик и отдаётся с app://sky
      # (см. electron/main.cjs) вместо загрузки боевого сайта — build:native
      # собирает dist/ с абсолютным адресом API (VITE_API_ORIGIN, см.
      # .env.native), electron-builder подхватывает его через build.files
      # в package.json.
      - name: Сборка веб-части (нативный режим)
        run: npm run build:native

      # electron-builder сам публикует GitHub Release, если видит CI=true
      # и решает, что публикация подразумевается по умолчанию — без
      # --publish=never падает на "GitHub Personal Access Token is not
      # set", даже когда публиковать релиз никто не просил.
      - name: Сборка установщика
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: sky-windows-installer
          path: release/*.exe
          if-no-files-found: error
