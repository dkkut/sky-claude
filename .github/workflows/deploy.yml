name: Deploy

# Деплой идёт с ветки разработки и вручную. Автодеплой по push в main
# намеренно не включён: сначала проверяем на этой ветке.
on:
  push:
    branches: [claude/project-server-setup-opwwui]
  workflow_dispatch:

concurrency:
  # Параллельные деплои на один сервер запрещены; текущий не прерываем,
  # чтобы не оборвать docker compose на полпути.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository }}-web
  IMAGE_API: ghcr.io/${{ github.repository }}-api

jobs:
  # ---------------------------------------------------------
  build:
    name: Сборка и проверка
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # tsc + vite. Падает здесь — до сервера ничего не уезжает.
      - name: Проверка типов и сборка
        run: npm run build

      # Опечатка в конфиге nginx валит веб-контейнер уже на сервере,
      # поэтому проверяем его здесь — до сборки и выкладки.
      - name: Проверка конфигурации nginx
        run: ./scripts/nginx-check.sh

      - uses: docker/setup-buildx-action@v3

      - name: Вход в реестр образов
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Образ web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Образ api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # ---------------------------------------------------------
  deploy:
    name: Выкладка на сервер
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка SSH
        env:
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh

          # Приватный ключ многострочный, и при вставке через телефон или
          # Windows переносы теряются — тогда ssh падает с "error in
          # libcrypto". Поэтому: предпочитаем SSH_KEY_B64 (одна строка
          # base64, ломаться нечему), а обычный SSH_KEY при необходимости
          # восстанавливаем — тело ключа это base64 без пробелов, его
          # достаточно снова разбить по 70 символов.
          if [ -n "${{ secrets.SSH_KEY_B64 }}" ]; then
            printf '%s' "${{ secrets.SSH_KEY_B64 }}" | tr -d '[:space:]' | base64 -d > ~/.ssh/id_deploy
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
            if ! grep -q 'PRIVATE KEY' ~/.ssh/id_deploy; then
              echo "::error::Секрет SSH_KEY не похож на приватный ключ — нет строки BEGIN ... PRIVATE KEY."
              exit 1
            fi
            # Переносов внутри нет — значит их съело при копировании.
            if [ "$(wc -l < ~/.ssh/id_deploy)" -le 2 ]; then
              echo "Переносы строк в ключе потеряны — восстанавливаю."
              HEADER=$(sed -n 's/.*\(-----BEGIN [A-Z ]*PRIVATE KEY-----\).*/\1/p' ~/.ssh/id_deploy | head -1)
              FOOTER=$(sed -n 's/.*\(-----END [A-Z ]*PRIVATE KEY-----\).*/\1/p' ~/.ssh/id_deploy | head -1)
              BODY=$(tr -d '\n' < ~/.ssh/id_deploy | sed "s/.*$HEADER//; s/$FOOTER.*//" | tr -d '[:space:]')
              { echo "$HEADER"; printf '%s' "$BODY" | fold -w 70; echo; echo "$FOOTER"; } > ~/.ssh/id_deploy
            fi
          fi
          chmod 600 ~/.ssh/id_deploy

          # Проверяем ключ до того, как им пользоваться: так причина видна
          # сразу, а не как невнятное "Permission denied".
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::Приватный ключ не читается. Задайте секрет SSH_KEY_B64 одной строкой:"
            echo "::error::  base64 -w0 /home/sky/.ssh/deploy"
            exit 1
          fi

          # Ключ сервера фиксируем, чтобы деплой не ушёл на подменённую машину.
          #
          # Способ 1 — SSH_HOST_FINGERPRINT: короткая строка SHA256:...,
          # её легко скопировать без ошибок. Ключ забираем сами и сверяем
          # с ней отпечаток. Способ 2 — SSH_KNOWN_HOSTS целиком, если он
          # уже настроен. Без обоих деплой не идёт: молча доверять ключу
          # неизвестного сервера нельзя.
          KNOWN="${{ secrets.SSH_KNOWN_HOSTS }}"
          FP="${{ secrets.SSH_HOST_FINGERPRINT }}"

          if [ -n "$FP" ]; then
            ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::Сервер $SSH_HOST:$SSH_PORT не ответил на запрос ключа."
              exit 1
            fi
            ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
            EXPECTED=$(printf '%s' "$FP" | tr -d '[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Отпечаток ключа сервера не совпал. Ожидали $EXPECTED, получили $ACTUAL."
              echo "::error::Либо секрет SSH_HOST_FINGERPRINT указан неверно, либо сервер подменён."
              exit 1
            fi
            echo "Отпечаток ключа сервера совпал: $ACTUAL"
          elif [ -n "$KNOWN" ]; then
            # Убираем возможные \r от копирования через Windows или телефон.
            printf '%s\n' "$KNOWN" | tr -d '\r' > ~/.ssh/known_hosts
          else
            echo "::error::Не задан ни SSH_HOST_FINGERPRINT, ни SSH_KNOWN_HOSTS."
            echo "::error::Получите отпечаток на сервере: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      # На сервер уезжает только то, что нужно для запуска:
      # исходников и .env среди этого нет.
      - name: Копирование конфигурации
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR:  ${{ vars.APP_DIR || '/opt/sky' }}
        run: |
          tar czf deploy-bundle.tgz docker-compose.yml \
            scripts/init-letsencrypt.sh scripts/rotate-secrets.sh \
            scripts/set-encryption-key.sh scripts/set-owner.sh \
            scripts/tv-source.sh scripts/tv-import.sh \
            scripts/set-ai-key.sh \
            scripts/set-sms-key.sh scripts/set-email.sh scripts/new-beta-keys.sh
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" deploy-bundle.tgz "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Запуск
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR:  ${{ vars.APP_DIR || '/opt/sky' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            APP_DIR="$APP_DIR" \
            WEB_IMAGE="${IMAGE_WEB}:${GITHUB_SHA}" \
            API_IMAGE="${IMAGE_API}:${GITHUB_SHA}" \
            GH_TOKEN="$GH_TOKEN" \
            GH_ACTOR="${{ github.actor }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          tar xzf deploy-bundle.tgz && rm -f deploy-bundle.tgz

          # Токен живёт только на время этого запуска.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          echo "==> Скачиваю образы"
          WEB_IMAGE="$WEB_IMAGE" API_IMAGE="$API_IMAGE" docker compose pull web api

          # Запоминаем образы в .env. Без этого «docker compose up -d»,
          # набранный на сервере руками, поднимал бы sky-*:local — образ
          # из первой ручной сборки, то есть откатывал приложение к
          # старому коду вместе со старой схемой базы.
          echo "==> Запоминаю образы в .env"
          for pair in "WEB_IMAGE=$WEB_IMAGE" "API_IMAGE=$API_IMAGE"; do
            key="${pair%%=*}"
            if grep -q "^$key=" .env; then
              sed -i "s|^$key=.*|$pair|" .env
            else
              printf '%s\n' "$pair" >> .env
            fi
          done

          echo "==> Перезапускаю"
          docker compose up -d --remove-orphans

          echo "==> Жду, пока сервисы станут healthy"
          for i in $(seq 1 30); do
            # Сравниваем поле целиком: grep -v healthy отбросил бы и
            # строку "unhealthy", то есть упавший сервис посчитался бы
            # исправным. certbot healthcheck-а не имеет и проверке не подлежит.
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
                        | awk '$1 != "certbot" && $2 != "healthy" { print $1 }' | tr '\n' ' ')
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          docker compose ps --format 'table {{.Service}}\t{{.Status}}'

          if [ -n "${unhealthy:-}" ]; then
            echo "::error::Сервисы не поднялись: $unhealthy"
            docker compose logs --tail 50
            exit 1
          fi

          docker logout ghcr.io
          # Чистим только образы без тегов, тома с данными не трогаем.
          docker image prune -f >/dev/null
          echo "==> Деплой завершён"
          REMOTE

      - name: Проверка домена снаружи
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::warning::Переменная DOMAIN не задана — внешняя проверка пропущена."
            exit 0
          fi
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$DOMAIN/healthz" || true)
            [ "$code" = "200" ] && { echo "https://$DOMAIN/healthz → 200"; exit 0; }
            sleep 6
          done
          echo "::error::https://$DOMAIN/healthz не отвечает 200"
          exit 1
