# ============================================================
#  Заголовки безопасности для market.kutrent.online.
#
#  Почти то же самое, что у основного sky.conf (см.
#  snippets/security-headers.conf), кроме двух вещей: этот сайт грузит
#  шрифт Manrope с Google Fonts (<link> в index.html), поэтому CSP
#  здесь отдельно разрешает fonts.googleapis.com/fonts.gstatic.com —
#  для основного домена Sky это разрешение не нужно и не выдаётся; и
#  виджет партнёра payli (market-site/index.html,
#  <script src="https://payli.ru/widget/embed.js">) — ему разрешены
#  payli.ru и его поддомены (CDN/iframe формы оплаты обычно живут на
#  отдельном поддомене) и только они, не весь интернет.
# ============================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options            "DENY"            always;
add_header X-Content-Type-Options     "nosniff"         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self \"https://payli.ru\"), usb=(), magnetometer=(), gyroscope=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://payli.ru https://*.payli.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://payli.ru https://*.payli.ru; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://payli.ru https://*.payli.ru; connect-src 'self' https://payli.ru https://*.payli.ru; frame-src https://payli.ru https://*.payli.ru; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://payli.ru https://*.payli.ru; object-src 'none'" always;
