# ============================================================
#  Заголовки безопасности для market.kutrent.online.
#
#  Почти то же самое, что у основного sky.conf (см.
#  snippets/security-headers.conf), кроме одного: этот сайт грузит
#  шрифт Manrope с Google Fonts (<link> в index.html), поэтому CSP
#  здесь отдельно разрешает fonts.googleapis.com/fonts.gstatic.com —
#  для основного домена Sky это разрешение не нужно и не выдаётся.
# ============================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options            "DENY"            always;
add_header X-Content-Type-Options     "nosniff"         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
