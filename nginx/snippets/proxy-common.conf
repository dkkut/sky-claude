# ============================================================
#  Общие параметры проксирования на бэкенд.
# ============================================================
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Бэкенд не должен получать заголовки соединения от клиента.
proxy_set_header Connection "";

proxy_connect_timeout 10s;
# proxy_read_timeout / proxy_send_timeout задаются в каждом location:
# у обычного API и у долгоживущего WebSocket они разные, а повторное
# указание директивы в одном блоке nginx считает ошибкой.

# Ответы API не кэшируем.
proxy_buffering off;
