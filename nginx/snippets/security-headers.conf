# ============================================================
#  Заголовки безопасности. Подключается в каждом server-блоке,
#  который отдаёт приложение.
# ============================================================

# HSTS: год, с поддоменами. Включается только на HTTPS-блоке.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Кликджекинг и MIME-sniffing.
add_header X-Frame-Options            "DENY"            always;
add_header X-Content-Type-Options     "nosniff"         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

# Отключаем то, чем приложение не пользуется.
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# Изоляция вкладки от чужих окон.
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# -- CSP -----------------------------------------------------
# Разрешения выведены из того, что приложение реально делает:
#   'unsafe-inline' в style-src  — React расставляет inline-стили через style={{}};
#   blob: в script-src/worker-src — песочница ботов запускает Worker из Blob;
#   blob:/data: в img/media       — обложки, загруженные треки и видео из IndexedDB;
#   wss:                          — WebSocket-хаб.
# Разрешения на шрифты Google больше нет: шрифты лежат у нас, наружу за
# ними никто не ходит. Оставленное «на всякий случай» разрешение однажды
# позволило бы вернуть внешнюю загрузку незаметно.
# 'unsafe-eval' намеренно НЕ выдан: см. DEPLOY.md, раздел про CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
