# ============================================================
#  Главный конфиг nginx — edge-слой Sky.
#  Раздаёт статику фронтенда и проксирует API и WebSocket-хаб.
# ============================================================
user  nginx;
worker_processes  auto;

# Пределы под сервер 12 ГБ RAM: воркеров по числу ядер,
# 4096 соединений на воркер с запасом на WebSocket-сессии.
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Версию nginx в заголовках не светим.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # Загрузка медиа (музыка, видео) — потолок на тело запроса.
    client_max_body_size 100m;
    client_body_timeout  60s;
    client_header_timeout 20s;

    # -- Защита от перебора и флуда ---------------------------
    # Ключ — IP клиента. 10m зоны хватает примерно на 160k адресов.
    limit_req_zone  $binary_remote_addr zone=req_general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=req_auth:10m    rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=req_code:10m    rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Отдельная зона для сокетов: они живут часами, и их потолок на
    # адрес — единицы, а не сотня одновременных запросов, как у обычных
    # страниц. Считать их вместе значило бы либо задушить страницы, либо
    # разрешить тысячу сокетов.
    limit_conn_zone $binary_remote_addr zone=conn_ws:10m;

    limit_req_status  429;
    limit_conn_status 429;

    # -- Сжатие -----------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
